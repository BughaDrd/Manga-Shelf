<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C0392B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mangá Shelf">
<title>Mangá Shelf</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#C0392B;--red2:#96281B;--red-bg:#FBF0EF;
  --ink:#1C1917;--ink2:#57534E;--ink3:#A8A29E;
  --paper:#FAFAF7;--surface:#FFFFFF;--surface2:#F5F4F0;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
@media(prefers-color-scheme:dark){:root{
  --ink:#F2EFE9;--ink2:#A8A29E;--ink3:#57534E;
  --paper:#161614;--surface:#1E1E1B;--surface2:#252520;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --red-bg:#2A1010;
}}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:16px}
.serif{font-family:'Noto Serif JP',serif}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
.topbar{
  padding:calc(var(--safe-top) + 14px) 16px 14px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar-brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo span{font-family:'Noto Serif JP',serif;color:#fff;font-size:16px;font-weight:700;line-height:1}
.brand-text .t1{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:700;line-height:1.1}
.brand-text .t2{font-size:11px;color:var(--ink2);margin-top:1px}
.topbar-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.topbar-btn:active{background:var(--surface2)}

.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px}

.navbar{
  display:flex;
  border-top:1px solid var(--border);
  background:var(--surface);
  padding-bottom:var(--safe-bottom);
  flex-shrink:0;
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;gap:3px;border:none;background:transparent;color:var(--ink3);transition:color .15s;position:relative}
.nav-btn.active{color:var(--red)}
.nav-btn i{font-size:22px}
.nav-btn span{font-size:10px;font-weight:500;letter-spacing:.2px}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:#F59E0B;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;min-width:16px;text-align:center}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 0 4px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat-label{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.stat-val{font-size:26px;font-weight:600;line-height:1;font-family:'Noto Serif JP',serif}
.stat-val.accent{color:var(--red)}

/* ── Section header ── */
.section-header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.section-title{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700}
.text-btn{background:transparent;border:none;color:var(--red);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px}

/* ── Work cards ── */
.works-list{display:flex;flex-direction:column;gap:10px}
.work-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;position:relative}
.work-thumb{width:72px;min-height:96px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif JP',serif;font-size:26px;color:rgba(255,255,255,.25);position:relative;overflow:hidden}
.work-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.work-body{flex:1;padding:12px 12px 12px 14px;min-width:0}
.work-name{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;line-height:1.25;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-author{font-size:12px;color:var(--ink2);margin-bottom:8px}
.work-progress-track{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.work-progress-fill{height:100%;background:var(--red);border-radius:99px;transition:width .4s}
.work-meta-row{display:flex;align-items:center;justify-content:space-between}
.work-count{font-size:12px;color:var(--ink2)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge-green{background:#DCFCE7;color:#15803D}
.badge-amber{background:#FEF3C7;color:#B45309}
.badge-red{background:var(--red-bg);color:var(--red)}
@media(prefers-color-scheme:dark){
  .badge-green{background:#14532D;color:#86EFAC}
  .badge-amber{background:#451A03;color:#FCD34D}
  .badge-red{background:#4A1010;color:#FCA5A5}
}
.work-actions{display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px 0;justify-content:center}
.icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger{color:var(--red);border-color:var(--red-bg);background:var(--red-bg)}

/* ── Volume grid ── */
.work-section{margin-bottom:20px}
.work-section-head{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px}
.work-section-name{font-family:'Noto Serif JP',serif;font-size:14px;font-weight:700}
.work-section-sub{font-size:12px;color:var(--ink2)}
.chip-legend{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;padding-top:4px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.legend-dot{width:10px;height:10px;border-radius:3px}
.vols-grid{display:flex;flex-wrap:wrap;gap:6px}
.vol-chip{
  width:42px;height:48px;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border2);background:var(--surface);
  color:var(--ink2);transition:transform .1s;position:relative;
  -webkit-user-select:none;user-select:none;
}
.vol-chip:active{transform:scale(.9)}
.vol-chip.owned{background:var(--red);color:#fff;border-color:var(--red)}
.vol-chip.wish{border-style:dashed;border-color:var(--red);color:var(--red);background:var(--red-bg)}
.alert-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#F59E0B;border:2px solid var(--surface)}

/* ── Alerts tab ── */
.alert-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.alert-icon{width:40px;height:40px;background:var(--red-bg);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--red);flex-shrink:0}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:14px;font-weight:500;margin-bottom:2px}
.alert-sub{font-size:12px;color:var(--ink2)}
.alert-price{font-size:17px;font-weight:700;color:var(--red);font-family:'Noto Serif JP',serif;white-space:nowrap}
.alert-dismiss{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);
  border-radius:22px 22px 0 0;
  width:100%;max-width:600px;
  padding:0 0 calc(var(--safe-bottom) + 16px);
  max-height:92vh;
  display:flex;flex-direction:column;
  animation:slideup .25s cubic-bezier(.32,1,.32,1);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-drag{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:12px auto 0;flex-shrink:0}
.modal-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 0;flex:1}
.modal-title{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{
  width:100%;font-family:'DM Sans',sans-serif;font-size:15px;
  padding:11px 14px;border:1.5px solid var(--border2);
  border-radius:12px;background:var(--surface2);color:var(--ink);
  outline:none;transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red)}
.field textarea{resize:none;min-height:90px;line-height:1.5}
.toggle-row{display:flex;gap:8px}
.tgl{flex:1;padding:10px 6px;border-radius:12px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--ink2);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s}
.tgl.active{border-color:var(--red);background:var(--red-bg);color:var(--red);font-weight:600}
.stars{display:flex;gap:4px;margin-top:2px}
.star{font-size:26px;cursor:pointer;color:var(--border2);line-height:1;-webkit-user-select:none;user-select:none;transition:color .1s}
.star.lit{color:#F59E0B}
.modal-footer{padding:14px 20px 0;display:flex;gap:8px;flex-shrink:0}
.btn{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border2);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;-webkit-appearance:none;appearance:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--red);color:#fff;border-color:var(--red);flex:1}
.btn-primary:active{background:var(--red2)}
.btn-danger{color:var(--red);border-color:var(--red-bg);background:var(--red-bg)}

/* ── Cover picker ── */
.cover-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cover-swatch{width:52px;height:64px;border-radius:8px;border:2px solid var(--border);cursor:pointer;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.4);font-family:'Noto Serif JP',serif;transition:border-color .15s}
.cover-swatch.sel{border-color:var(--red);border-width:2.5px}
.cover-swatch img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cover-add{width:52px;height:64px;border-radius:8px;border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;color:var(--ink3)}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 24px;color:var(--ink2)}
.empty-icon{font-size:48px;margin-bottom:12px;display:block}
.empty p{font-size:14px;line-height:1.7}

/* ── Confirm dialog ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--surface);border-radius:20px;padding:24px;width:100%;max-width:320px;animation:popin .2s cubic-bezier(.32,1,.32,1)}
@keyframes popin{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.confirm-title{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:700;margin-bottom:8px}
.confirm-msg{font-size:14px;color:var(--ink2);line-height:1.5;margin-bottom:20px}
.confirm-btns{display:flex;gap:8px}
.confirm-cancel{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--border2);background:transparent;color:var(--ink);font-size:15px;cursor:pointer;font-family:'DM Sans',sans-serif}
.confirm-ok{flex:1;padding:12px;border-radius:12px;border:none;background:var(--red);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ── Install banner ── */
.install-banner{margin:14px 0 0;background:var(--red-bg);border:1px solid rgba(192,57,43,.2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.install-banner i{font-size:22px;color:var(--red);flex-shrink:0}
.install-banner-text{flex:1;font-size:13px;color:var(--ink);line-height:1.4}
.install-banner-text b{color:var(--red)}
.install-close{background:transparent;border:none;color:var(--ink3);font-size:18px;cursor:pointer;padding:0;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="logo"><span>漫</span></div>
      <div class="brand-text">
        <div class="t1">Mangá Shelf</div>
        <div class="t2">Seu acervo pessoal</div>
      </div>
    </div>
    <button class="topbar-btn" onclick="openSearch()" aria-label="Buscar"><i class="ti ti-search"></i></button>
  </div>

  <div class="scroll-area" id="scroll-area">
    <div id="install-banner-wrap"></div>
    <div id="view-content"></div>
  </div>

  <nav class="navbar">
    <button class="nav-btn active" id="nav-obras" onclick="setTab('obras')">
      <i class="ti ti-books"></i><span>Obras</span>
    </button>
    <button class="nav-btn" id="nav-volumes" onclick="setTab('volumes')">
      <i class="ti ti-layout-grid"></i><span>Volumes</span>
    </button>
    <button class="nav-btn" id="nav-alertas" onclick="setTab('alertas')">
      <i class="ti ti-bell"></i><span>Alertas</span>
      <span class="nav-badge" id="alert-badge" style="display:none"></span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="confirm-root"></div>

<script>
// ── Storage ─────────────────────────────────────────────
const LS = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

// ── Default data ─────────────────────────────────────────
const DEFAULT_WORKS = [
  {id:'w1',name:'Berserk',author:'Kentaro Miura',totalVols:41,cover:'',color:'#1C1710'},
  {id:'w2',name:'Vagabond',author:'Takehiko Inoue',totalVols:37,cover:'',color:'#1A2C1A'},
  {id:'w3',name:'Vinland Saga',author:'Makoto Yukimura',totalVols:27,cover:'',color:'#12182C'},
];
const DEFAULT_VOLS = [
  {id:'v1',workId:'w1',num:1,owned:true,price:35.90,notes:'Capa dura especial',rating:5,cover:'',wish:false},
  {id:'v2',workId:'w1',num:2,owned:true,price:29.90,notes:'',rating:4,cover:'',wish:false},
  {id:'v3',workId:'w1',num:3,owned:true,price:29.90,notes:'',rating:5,cover:'',wish:false},
  {id:'v4',workId:'w1',num:4,owned:false,price:0,notes:'',rating:0,cover:'',wish:true},
  {id:'v5',workId:'w1',num:5,owned:false,price:0,notes:'',rating:0,cover:'',wish:false},
  {id:'v6',workId:'w2',num:1,owned:true,price:42.00,notes:'Edição colecionador',rating:5,cover:'',wish:false},
  {id:'v7',workId:'w2',num:2,owned:true,price:38.00,notes:'',rating:4,cover:'',wish:false},
  {id:'v8',workId:'w2',num:3,owned:false,price:0,notes:'',rating:0,cover:'',wish:true},
  {id:'v9',workId:'w3',num:1,owned:true,price:31.00,notes:'',rating:4,cover:'',wish:false},
  {id:'v10',workId:'w3',num:2,owned:false,price:0,notes:'',rating:0,cover:'',wish:false},
];
const DEFAULT_ALERTS = [
  {id:'a1',workId:'w1',volNum:4,store:'Amazon',price:19.90,date:'2024-06-01',url:'#'},
  {id:'a2',workId:'w2',volNum:3,store:'Magalu',price:24.50,date:'2024-06-02',url:'#'},
];

// ── State ────────────────────────────────────────────────
let DB = {
  works:   LS.get('ms_works')   || DEFAULT_WORKS,
  volumes: LS.get('ms_volumes') || DEFAULT_VOLS,
  alerts:  LS.get('ms_alerts')  || DEFAULT_ALERTS,
};
let tab = 'obras';
let searchQ = '';
let ratingTemp = 0;
let deferredPrompt = null;

function save(){
  LS.set('ms_works',   DB.works);
  LS.set('ms_volumes', DB.volumes);
  LS.set('ms_alerts',  DB.alerts);
}

// ── Helpers ──────────────────────────────────────────────
const byId    = id => DB.works.find(w => w.id === id);
const volsFor = wid => DB.volumes.filter(v => v.workId === wid);
const uid     = () => '_' + Math.random().toString(36).slice(2,9);

// ── Tab ──────────────────────────────────────────────────
function setTab(t){
  tab = t;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+t).classList.add('active');
  render();
}

// ── Render ───────────────────────────────────────────────
function render(){
  updateBadge();
  const el = document.getElementById('view-content');
  if(tab === 'obras')    el.innerHTML = renderObras();
  if(tab === 'volumes')  el.innerHTML = renderVolumes();
  if(tab === 'alertas')  el.innerHTML = renderAlertas();
}

function updateBadge(){
  const b = document.getElementById('alert-badge');
  if(DB.alerts.length){ b.textContent = DB.alerts.length; b.style.display = ''; }
  else b.style.display = 'none';
}

// ── Obras view ───────────────────────────────────────────
function renderObras(){
  const q = searchQ.toLowerCase();
  const works = DB.works.filter(w =>
    w.name.toLowerCase().includes(q) || w.author.toLowerCase().includes(q)
  );

  const owned  = DB.volumes.filter(v => v.owned).length;
  const missing = DB.volumes.filter(v => !v.owned).length;
  const spent  = DB.volumes.filter(v => v.owned).reduce((s,v) => s+v.price, 0);

  const stats = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Possuídos</div><div class="stat-val">${owned}</div></div>
      <div class="stat-card"><div class="stat-label">Faltando</div><div class="stat-val accent">${missing}</div></div>
      <div class="stat-card"><div class="stat-label">Obras</div><div class="stat-val">${DB.works.length}</div></div>
      <div class="stat-card"><div class="stat-label">Total gasto</div><div class="stat-val" style="font-size:19px">R$${spent.toFixed(2)}</div></div>
    </div>`;

  const header = `
    <div class="section-header">
      <div class="section-title">Minhas obras</div>
      <button class="text-btn" onclick="openAddWork()"><i class="ti ti-plus"></i> Nova obra</button>
    </div>`;

  if(!works.length) return stats + header + `<div class="empty"><span class="empty-icon">📚</span><p>Nenhuma obra encontrada.<br>Toque em <b>Nova obra</b> para começar!</p></div>`;

  const cards = works.map(w => {
    const vols  = volsFor(w.id);
    const own   = vols.filter(v => v.owned).length;
    const tot   = w.totalVols;
    const pct   = tot > 0 ? Math.round(own/tot*100) : 0;
    const alerts= DB.alerts.filter(a => a.workId === w.id).length;
    const thumb = w.cover
      ? `<img src="${escHtml(w.cover)}" onerror="this.remove()" alt="">`
      : `<span>${escHtml(w.name[0])}</span>`;
    const badgesHtml = [
      own === tot && tot > 0 ? `<span class="badge badge-green">✓ Completa</span>` : `<span class="badge badge-amber">${tot-own} faltando</span>`,
      alerts ? `<span class="badge badge-red"><i class="ti ti-bell" style="font-size:10px"></i> ${alerts} oferta${alerts>1?'s':''}</span>` : ''
    ].join('');
    return `
      <div class="work-card">
        <div class="work-thumb" style="background:${escHtml(w.color)}" onclick="openWorkDetail('${w.id}')">${thumb}</div>
        <div class="work-body" onclick="openWorkDetail('${w.id}')">
          <div class="work-name">${escHtml(w.name)}</div>
          <div class="work-author">${escHtml(w.author)}</div>
          <div class="work-progress-track"><div class="work-progress-fill" style="width:${pct}%"></div></div>
          <div class="work-meta-row">
            <span class="work-count">${own}/${tot} vols</span>
            <div class="badges">${badgesHtml}</div>
          </div>
        </div>
        <div class="work-actions">
          <button class="icon-btn" onclick="openEditWork('${w.id}')" aria-label="Editar"><i class="ti ti-edit"></i></button>
          <button class="icon-btn danger" onclick="confirmDeleteWork('${w.id}')" aria-label="Excluir"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
  }).join('');

  return stats + header + `<div class="works-list">${cards}</div><div style="height:8px"></div>`;
}

// ── Volumes view ─────────────────────────────────────────
function renderVolumes(){
  const q = searchQ.toLowerCase();
  const works = DB.works.filter(w =>
    w.name.toLowerCase().includes(q) || w.author.toLowerCase().includes(q)
  );
  if(!works.length) return `<div class="empty"><span class="empty-icon">📖</span><p>Nenhuma obra cadastrada ainda.</p></div>`;

  const legend = `
    <div class="chip-legend" style="padding-top:14px">
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Possuo</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red-bg);border:1.5px dashed var(--red)"></div>Alerta</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--surface);border:1.5px solid var(--border2)"></div>Faltando</div>
    </div>`;

  const sections = works.map(w => {
    const vols = volsFor(w.id);
    const own  = vols.filter(v => v.owned).length;
    const chips = Array.from({length: w.totalVols}, (_, i) => {
      const n = i+1;
      const vol = vols.find(v => v.num === n);
      const hasAlert = DB.alerts.some(a => a.workId === w.id && a.volNum === n);
      const cls = vol && vol.owned ? 'owned' : (vol && vol.wish ? 'wish' : '');
      return `<div class="vol-chip ${cls}" onclick="openVolDetail('${w.id}',${n})">${n}${hasAlert?`<div class="alert-dot"></div>`:''}</div>`;
    }).join('');
    return `
      <div class="work-section">
        <div class="work-section-head">
          <div class="work-section-name">${escHtml(w.name)}</div>
          <div class="work-section-sub">${own}/${w.totalVols}</div>
        </div>
        <div class="vols-grid">${chips}</div>
      </div>`;
  }).join('');

  return legend + sections;
}

// ── Alertas view ─────────────────────────────────────────
function renderAlertas(){
  if(!DB.alerts.length) return `
    <div class="empty" style="padding-top:60px">
      <span class="empty-icon">🔔</span>
      <p>Nenhuma promoção no momento.<br>Marque volumes como <b>Alerta de preço</b><br>para acompanhá-los.</p>
    </div>`;

  const header = `<div class="section-header"><div class="section-title">Ofertas ativas</div></div>`;

  const cards = DB.alerts.map(a => {
    const w = byId(a.workId);
    return `
      <div class="alert-card">
        <div class="alert-icon"><i class="ti ti-tag"></i></div>
        <div class="alert-body">
          <div class="alert-title">${w ? escHtml(w.name) : '?'} — Vol. ${a.volNum}</div>
          <div class="alert-sub">${escHtml(a.store)} · ${a.date}</div>
        </div>
        <div class="alert-price">R$${a.price.toFixed(2)}</div>
        <button class="alert-dismiss" onclick="dismissAlert('${a.id}')" aria-label="Dispensar"><i class="ti ti-x"></i></button>
      </div>`;
  }).join('');

  const addBtn = `
    <div style="padding:4px 0 8px">
      <button class="btn" style="width:100%" onclick="openAddAlert()"><i class="ti ti-plus"></i> Registrar oferta manualmente</button>
    </div>`;

  return header + cards + addBtn;
}

// ── Work detail modal ────────────────────────────────────
function openWorkDetail(wid){
  const w    = byId(wid);
  const vols = volsFor(wid);
  const own  = vols.filter(v => v.owned).length;
  const spent= vols.filter(v => v.owned).reduce((s,v) => s+v.price, 0);

  const chips = Array.from({length: w.totalVols}, (_, i) => {
    const n = i+1;
    const vol = vols.find(v => v.num === n);
    const hasAlert = DB.alerts.some(a => a.workId === wid && a.volNum === n);
    const cls = vol && vol.owned ? 'owned' : (vol && vol.wish ? 'wish' : '');
    return `<div class="vol-chip ${cls}" onclick="closeModal();setTimeout(()=>openVolDetail('${wid}',${n}),120)">${n}${hasAlert?`<div class="alert-dot"></div>`:''}</div>`;
  }).join('');

  showModal(`
    <div class="modal-title"><i class="ti ti-books" style="color:var(--red)"></i> ${escHtml(w.name)}</div>
    <div class="stats-row" style="padding-top:0;margin-bottom:16px">
      <div class="stat-card"><div class="stat-label">Possuídos</div><div class="stat-val">${own}</div></div>
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-val">${w.totalVols}</div></div>
      <div class="stat-card"><div class="stat-label">Gasto</div><div class="stat-val" style="font-size:17px">R$${spent.toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">Concluída</div><div class="stat-val" style="font-size:17px">${own===w.totalVols&&w.totalVols>0?'✓':'Não'}</div></div>
    </div>
    <div style="font-size:12px;color:var(--ink2);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Volumes</div>
    <div class="vols-grid">${chips}</div>
  `, [
    {label:'<i class="ti ti-edit"></i> Editar', action:`closeModal();openEditWork('${wid}')`},
    {label:'<i class="ti ti-plus"></i> Adicionar', primary:true, action:`closeModal();setTimeout(()=>openAddVolForWork('${wid}'),120)`},
  ]);
}

// ── Add / Edit work ──────────────────────────────────────
function openAddWork(){
  showModal(`
    <div class="modal-title">Nova obra</div>
    <div class="field"><label>Nome da obra</label><input id="w-name" type="text" placeholder="Ex: One Piece" autocomplete="off"></div>
    <div class="field"><label>Autor</label><input id="w-author" type="text" placeholder="Ex: Eiichiro Oda" autocomplete="off"></div>
    <div class="field"><label>Total de volumes previstos</label><input id="w-total" type="number" min="1" value="1"></div>
    <div class="field"><label>URL da capa (opcional)</label><input id="w-cover" type="url" placeholder="https://..."></div>
    <div class="field"><label>Cor de destaque</label><input id="w-color" type="color" value="#1C1710" style="height:44px;padding:4px 8px;cursor:pointer"></div>
  `, [
    {label:'Cancelar', action:'closeModal()'},
    {label:'<i class="ti ti-check"></i> Salvar', primary:true, action:'saveWork()'},
  ]);
}

function openEditWork(wid){
  const w = byId(wid);
  showModal(`
    <div class="modal-title">Editar obra</div>
    <div class="field"><label>Nome da obra</label><input id="w-name" type="text" value="${escAttr(w.name)}"></div>
    <div class="field"><label>Autor</label><input id="w-author" type="text" value="${escAttr(w.author)}"></div>
    <div class="field"><label>Total de volumes previstos</label><input id="w-total" type="number" min="1" value="${w.totalVols}"></div>
    <div class="field"><label>URL da capa (opcional)</label><input id="w-cover" type="url" value="${escAttr(w.cover||'')}"></div>
    <div class="field"><label>Cor de destaque</label><input id="w-color" type="color" value="${escAttr(w.color)}" style="height:44px;padding:4px 8px;cursor:pointer"></div>
    <input type="hidden" id="w-id" value="${wid}">
  `, [
    {label:'<i class="ti ti-trash"></i>', danger:true, action:`closeModal();confirmDeleteWork('${wid}')`},
    {label:'Cancelar', action:'closeModal()'},
    {label:'<i class="ti ti-check"></i> Salvar', primary:true, action:'saveWork()'},
  ]);
}

function saveWork(){
  const wid   = (document.getElementById('w-id')||{}).value;
  const name  = (document.getElementById('w-name').value||'').trim();
  const author= (document.getElementById('w-author').value||'').trim();
  const total = parseInt(document.getElementById('w-total').value)||1;
  const cover = (document.getElementById('w-cover').value||'').trim();
  const color = document.getElementById('w-color').value;
  if(!name) return;
  if(wid){
    const w = byId(wid);
    Object.assign(w, {name,author,totalVols:total,cover,color});
  } else {
    DB.works.push({id:uid(),name,author,totalVols:total,cover,color});
  }
  save(); closeModal(); render();
}

function confirmDeleteWork(wid){
  const w = byId(wid);
  showConfirm(
    `Excluir "${w.name}"?`,
    `Isso vai remover a obra e todos os seus ${volsFor(wid).length} volume(s) registrados. Essa ação não pode ser desfeita.`,
    () => deleteWork(wid)
  );
}

function deleteWork(wid){
  DB.works   = DB.works.filter(w => w.id !== wid);
  DB.volumes = DB.volumes.filter(v => v.workId !== wid);
  DB.alerts  = DB.alerts.filter(a => a.workId !== wid);
  save(); render();
}

// ── Volume detail ────────────────────────────────────────
function openVolDetail(wid, num){
  const w   = byId(wid);
  const vol = DB.volumes.find(v => v.workId === wid && v.num === num);
  ratingTemp = vol ? vol.rating : 0;

  const status = vol && vol.owned ? 'owned' : (vol && vol.wish ? 'wish' : 'none');
  const hasAlert = DB.alerts.some(a => a.workId === wid && a.volNum === num);

  showModal(`
    <div class="modal-title">${escHtml(w.name)} — Vol. ${num}</div>
    <div class="field"><label>Status</label>
      <div class="toggle-row">
        <button class="tgl ${status==='owned'?'active':''}" id="tgl-owned" onclick="setTgl('owned')">✓ Possuo</button>
        <button class="tgl ${status==='wish'?'active':''}" id="tgl-wish" onclick="setTgl('wish')">🔔 Alerta</button>
        <button class="tgl ${status==='none'?'active':''}" id="tgl-none" onclick="setTgl('none')">— Faltando</button>
      </div>
    </div>
    <div id="owned-fields" style="${status!=='owned'?'display:none':''}">
      <div class="field"><label>Valor pago (R$)</label><input id="vol-price" type="number" min="0" step="0.01" placeholder="0,00" value="${vol&&vol.price?vol.price:''}"></div>
      <div class="field"><label>Avaliação</label>
        <div class="stars" id="stars">
          ${[1,2,3,4,5].map(s=>`<span class="star ${ratingTemp>=s?'lit':''}" onclick="setRating(${s})">${ratingTemp>=s?'★':'☆'}</span>`).join('')}
        </div>
      </div>
      <div class="field"><label>Notas e comentários</label><textarea id="vol-notes" placeholder="Edição especial, onde comprei, impressões...">${vol?escHtml(vol.notes):''}</textarea></div>
      <div class="field"><label>URL da capa (opcional)</label><input id="vol-cover" type="url" placeholder="https://..." value="${vol&&vol.cover?escAttr(vol.cover):''}"></div>
    </div>
    ${hasAlert?`<div style="background:var(--red-bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--red);margin-bottom:4px"><i class="ti ti-bell-ringing"></i> Há uma oferta ativa para este volume!</div>`:''}
    <input type="hidden" id="vol-wid" value="${wid}">
    <input type="hidden" id="vol-num" value="${num}">
    <input type="hidden" id="vol-id" value="${vol?vol.id:''}">
  `, [
    vol ? {label:'<i class="ti ti-trash"></i>', danger:true, action:`deleteVol('${wid}',${num})`} : null,
    {label:'Cancelar', action:'closeModal()'},
    {label:'<i class="ti ti-device-floppy"></i> Salvar', primary:true, action:'saveVol()'},
  ].filter(Boolean));
}

function setTgl(type){
  ['owned','wish','none'].forEach(t => document.getElementById('tgl-'+t).classList.remove('active'));
  document.getElementById('tgl-'+type).classList.add('active');
  document.getElementById('owned-fields').style.display = type==='owned' ? '' : 'none';
}

function setRating(n){
  ratingTemp = n;
  document.querySelectorAll('.star').forEach((s,i) => {
    s.className = 'star' + (i<n?' lit':'');
    s.textContent = i<n?'★':'☆';
  });
}

function saveVol(){
  const wid   = document.getElementById('vol-wid').value;
  const num   = parseInt(document.getElementById('vol-num').value);
  const oldId = document.getElementById('vol-id').value;
  const active= document.querySelector('.tgl.active');
  const status= active ? active.id.replace('tgl-','') : 'none';
  const owned = status==='owned';
  const wish  = status==='wish';
  const priceEl= document.getElementById('vol-price');
  const notesEl= document.getElementById('vol-notes');
  const coverEl= document.getElementById('vol-cover');
  const price = priceEl ? (parseFloat(priceEl.value)||0) : 0;
  const notes = notesEl ? notesEl.value : '';
  const cover = coverEl ? coverEl.value.trim() : '';

  const existing = DB.volumes.find(v => v.workId===wid && v.num===num);
  if(existing){
    Object.assign(existing, {owned,wish,price,notes,rating:ratingTemp,cover});
  } else {
    DB.volumes.push({id:uid(),workId:wid,num,owned,wish,price,notes,rating:ratingTemp,cover});
  }
  save(); closeModal(); render();
}

function deleteVol(wid, num){
  DB.volumes = DB.volumes.filter(v => !(v.workId===wid && v.num===num));
  save(); closeModal(); render();
}

function openAddVolForWork(wid){
  const vols = volsFor(wid);
  const w = byId(wid);
  const nextMissing = Array.from({length:w.totalVols},(_,i)=>i+1).find(n=>!vols.find(v=>v.num===n)) || w.totalVols+1;
  openVolDetail(wid, nextMissing);
}

// ── Alerts ───────────────────────────────────────────────
function dismissAlert(id){
  DB.alerts = DB.alerts.filter(a => a.id !== id);
  save(); render();
}

function openAddAlert(){
  showModal(`
    <div class="modal-title">Registrar oferta</div>
    <div class="field"><label>Obra</label>
      <select id="al-work">${DB.works.map(w=>`<option value="${w.id}">${escHtml(w.name)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Número do volume</label><input id="al-num" type="number" min="1" value="1"></div>
    <div class="field"><label>Loja</label><input id="al-store" type="text" placeholder="Amazon, Magalu, Saraiva..."></div>
    <div class="field"><label>Preço (R$)</label><input id="al-price" type="number" min="0" step="0.01" placeholder="0,00"></div>
    <div class="field"><label>Link da oferta (opcional)</label><input id="al-url" type="url" placeholder="https://..."></div>
  `, [
    {label:'Cancelar', action:'closeModal()'},
    {label:'<i class="ti ti-bell"></i> Salvar alerta', primary:true, action:'saveAlert()'},
  ]);
}

function saveAlert(){
  const wid   = document.getElementById('al-work').value;
  const num   = parseInt(document.getElementById('al-num').value)||1;
  const store = document.getElementById('al-store').value.trim() || 'Loja';
  const price = parseFloat(document.getElementById('al-price').value)||0;
  const url   = document.getElementById('al-url').value.trim() || '#';
  const date  = new Date().toISOString().slice(0,10);
  DB.alerts.push({id:uid(),workId:wid,volNum:num,store,price,date,url});
  save(); closeModal(); render();
}

// ── Search ───────────────────────────────────────────────
function openSearch(){
  const q = searchQ;
  showModal(`
    <div class="modal-title">Buscar</div>
    <div class="field"><input id="search-inp" type="search" placeholder="Nome da obra ou autor..." value="${escAttr(q)}" autofocus style="font-size:16px"></div>
  `, [
    {label:'Limpar', action:'clearSearch()'},
    {label:'<i class="ti ti-search"></i> Buscar', primary:true, action:'applySearch()'},
  ]);
  setTimeout(()=>{ const el=document.getElementById('search-inp'); if(el)el.focus(); },100);
}
function applySearch(){ searchQ=(document.getElementById('search-inp').value||'').trim(); closeModal(); render(); }
function clearSearch(){ searchQ=''; closeModal(); render(); }

// ── Modal engine ─────────────────────────────────────────
function showModal(bodyHtml, buttons){
  const btns = (buttons||[]).map(b => {
    if(!b) return '';
    const cls = b.primary?'btn btn-primary':b.danger?'btn btn-danger':'btn';
    return `<button class="${cls}" onclick="${b.action}">${b.label}</button>`;
  }).join('');
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" role="dialog">
        <div class="modal-drag"></div>
        <div class="modal-scroll">${bodyHtml}</div>
        ${btns ? `<div class="modal-footer">${btns}</div>` : ''}
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; ratingTemp=0; }

// ── Confirm dialog ───────────────────────────────────────
function showConfirm(title, msg, onOk){
  window._confirmOk = onOk;
  document.getElementById('confirm-root').innerHTML = `
    <div class="confirm-overlay">
      <div class="confirm-box">
        <div class="confirm-title">${escHtml(title)}</div>
        <div class="confirm-msg">${escHtml(msg)}</div>
        <div class="confirm-btns">
          <button class="confirm-cancel" onclick="closeConfirm()">Cancelar</button>
          <button class="confirm-ok" onclick="doConfirm()">Excluir</button>
        </div>
      </div>
    </div>`;
}
function closeConfirm(){ document.getElementById('confirm-root').innerHTML=''; }
function doConfirm(){ closeConfirm(); if(window._confirmOk) window._confirmOk(); }

// ── Escape helpers ───────────────────────────────────────
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }

// ── Install banner ───────────────────────────────────────
function renderInstallBanner(){
  const wrap = document.getElementById('install-banner-wrap');
  if(!deferredPrompt || localStorage.getItem('ms_install_dismissed')) { wrap.innerHTML=''; return; }
  wrap.innerHTML = `
    <div class="install-banner">
      <i class="ti ti-device-mobile"></i>
      <div class="install-banner-text"><b>Instalar como app</b><br>Adicione à tela inicial para usar offline!</div>
      <button class="topbar-btn" onclick="triggerInstall()" style="background:var(--red);color:#fff;border:none;width:auto;padding:0 12px;font-size:13px;height:34px;border-radius:10px">Instalar</button>
      <button class="install-close" onclick="dismissInstall()"><i class="ti ti-x"></i></button>
    </div>`;
}
function triggerInstall(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r => { deferredPrompt=null; renderInstallBanner(); });
}
function dismissInstall(){
  localStorage.setItem('ms_install_dismissed','1');
  renderInstallBanner();
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; renderInstallBanner();
});

// ── Service Worker ───────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// ── Boot ─────────────────────────────────────────────────
render();
renderInstallBanner();
</script>
</body>
</html>
